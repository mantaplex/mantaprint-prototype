# /etc/systemd/journald.conf.d/00-heykprint.conf
# Journald configuration tuned for 47MB zram /var/log on Armbian S905X

[Journal]
# Store volatile logs strictly in memory/zram with hard boundaries
Storage=volatile
RuntimeMaxUse=15M
RuntimeKeepFree=10M
RuntimeMaxFileSize=3M
MaxRetentionSec=2day

# Rate limiting to prevent CUPS filter spam from overwhelming memory
RateLimitIntervalSec=30s
RateLimitBurst=1000
