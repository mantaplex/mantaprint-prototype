# HeykPrint CUPS Configuration Snippet
# Target: /etc/cups/cupsd.conf (Hardened for Armbian S905X with 47MB zram)

# ==============================================================================
# LOGGING & ZRAM RESOURCE PROTECTION
# ==============================================================================
# NEVER use LogLevel debug in production on zram /var/log!
LogLevel warn
MaxLogSize 512k

# Direct logs through syslog to avoid unbounded writes on zram
AccessLog /dev/null
ErrorLog syslog
PageLog syslog

# ==============================================================================
# FLASH STORAGE (eMMC) & MEMORY PRESERVATION
# ==============================================================================
# Never keep processed raster print job files indefinitely on eMMC
PreserveJobHistory No
PreserveJobFiles No
MaxJobs 20
MaxCopies 10

# ==============================================================================
# NETWORK & BINDING
# ==============================================================================
Port 631
Listen /run/cups/cups.sock
Browsing Yes
BrowseLocalProtocols dnssd

# ==============================================================================
# DRIVERLESS GUEST PRINT POLICY (iOS AirPrint, ChromeOS, Mopria)
# ==============================================================================
<Policy driverless-guest>
  # Job submission operations: unauthenticated guest access from LAN clients
  <Limit Create-Job Print-Job Print-URI Send-Document Send-URI Validate-Job>
    Order deny,allow
    Allow from all
    Require user @all
  </Limit>

  # Status queries: allow all devices on network
  <Limit Get-Job-Attributes Get-Jobs Get-Printer-Attributes Get-Printer-Supported-Values>
    Order deny,allow
    Allow from all
  </Limit>

  # Administrative operations: strictly root/system on localhost
  <Limit Pause-Printer Resume-Printer Purge-Jobs Set-Printer-Attributes Delete-Printer CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Set-Default CUPS-Move-Job>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
    Allow from 127.0.0.1
    Allow from ::1
  </Limit>

  # Cancel jobs: owner or admin
  <Limit Cancel-Job Cancel-Jobs>
    Order deny,allow
    Require user @OWNER @SYSTEM
  </Limit>

  # All other operations
  <Limit All>
    Order deny,allow
    Allow from all
  </Limit>
</Policy>

# Set as default policy
DefaultPolicy driverless-guest
