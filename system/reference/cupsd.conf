# HeykPrint CUPS Configuration - Universal Driverless Print Server
# Production-hardened for Armbian Amlogic S905X
# Full support for ChromeOS, Android Mopria, iOS AirPrint, Windows 10/11, macOS

# ==============================================================================
# LOGGING & RESOURCE PROTECTION
# ==============================================================================
LogLevel info
MaxLogSize 2m
ErrorLog /var/log/cups/error_log
AccessLog /var/log/cups/access_log
PageLog /var/log/cups/page_log

# ==============================================================================
# JOB HISTORY PRESERVATION (CRITICAL FOR CLIENT STATUS TRACKING)
# ==============================================================================
PreserveJobHistory Yes
PreserveJobFiles 1d
MaxJobs 100
MaxCopies 10
ErrorPolicy retry-job

# ==============================================================================
# NETWORK & IPC BINDINGS
# ==============================================================================
Port 631
Listen /run/cups/cups.sock
Browsing On
BrowseLocalProtocols none
DefaultAuthType Basic
WebInterface Yes
IdleExitTimeout 0
ServerAlias *

# ==============================================================================
# PERMISSIVE LOCATIONS FOR DRIVERLESS NETWORK PRINTING
# ==============================================================================
<Location />
  Order allow,deny
  Allow all
</Location>

<Location /printers>
  Order allow,deny
  Allow all
</Location>

<Location /jobs>
  Order allow,deny
  Allow all
</Location>

<Location /admin>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/conf>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

<Location /admin/log>
  AuthType Default
  Require user @SYSTEM
  Order allow,deny
  Allow all
</Location>

# ==============================================================================
# PERMISSIVE POLICY FOR ZERO-AUTH CLIENT PRINTING & STATUS MONITORING
# ==============================================================================
<Policy default>
  # Expose job status & attributes to unauthenticated network clients (Android, ChromeOS, iOS)
  JobPrivateAccess none
  JobPrivateValues none
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  # Allow all clients to submit, validate, query jobs and documents without authentication
  <Limit Create-Job Print-Job Print-URI Validate-Job Send-Document Send-URI Get-Job-Attributes Get-Jobs>
    Order deny,allow
  </Limit>

  # Restrict job manipulation to the job owner or system administrator
  <Limit Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job Cancel-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Get-Document>
    AuthType Default
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  # Administrative commands require SYSTEM credentials
  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
