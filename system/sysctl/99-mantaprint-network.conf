# MantaPrint Hub - Multi-Interface Dual-Homing & Fast Failover Sysctl
# Prevents network lockups when switching between Ethernet (LAN) and Wi-Fi (WLAN).

# 1. Ignore routes on interfaces where carrier link is down (e.g. Ethernet cable unplugged)
# This allows the Linux kernel to automatically skip dead Ethernet routes and use Wi-Fi immediately.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1

# 2. Set Reverse Path Filtering to loose mode (2)
# Prevents kernel from dropping incoming packets on Wi-Fi when both interfaces share a subnet or default route.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# 3. ARP behavior: reply only if target IP matches receiving interface, announce best local IP
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
