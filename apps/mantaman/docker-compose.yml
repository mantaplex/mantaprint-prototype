version: '3.8'

services:
  mantaman:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mantaman-controller
    restart: unless-stopped
    ports:
      - "8443:8443"         # Web Console & Agent WebSocket
      - "9876:9876/udp"     # L2 UDP Discovery Beacon Listener
    environment:
      - NODE_ENV=production
      - MANTAMAN_PORT=8443
      - MANTAMAN_HOST=0.0.0.0
      - MANTAMAN_DB_PATH=/var/lib/mantaman/mantaman.sqlite
      - MANTAMAN_ENROLLMENT_TOKEN=CORP-PROD-2026
    volumes:
      - mantaman_data:/var/lib/mantaman
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  mantaman_data:
    name: mantaman_sqlite_wal_data
